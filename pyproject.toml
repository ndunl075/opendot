[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alfred-core"
version = "0.1.0"
description = "Local-first personal assistant core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Alfred contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "mcp>=1.10,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
alfred = "alfred.cli:main"
alfred-mcp = "alfred.mcp_server:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/alfred"]
