[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alfred-core"
version = "0.2.0"
description = "Local-first personal assistant core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Alfred contributors" }]
dependencies = [
  "cryptography>=44,<51",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<27",
  "mcp>=1.10,<2",
  "pydantic>=2.8,<3",
  "sqlite-vec>=0.1.9,<1",
  "slack-sdk>=3.36,<4",
  "starlette>=0.40,<2",
  "tzdata>=2025.2,<2027",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
alfred = "alfred.cli:main"
alfred-mcp = "alfred.mcp_server:main"
alfred-service = "alfred.winservice:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/alfred"]
