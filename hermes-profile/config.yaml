# Model/provider defaults for this profile. Per README.md's install flow,
# Hermes preserves this file across `hermes profile update` (pass
# --force-config to override), so local edits here are safe to make and keep.
#
# NOT independently verified against a real Hermes install yet -- built from
# https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models.
# If any key name below doesn't match what your installed Hermes actually
# reads, that's a real gap in this file; fix it here (or flag it back) rather
# than working around it by hand each time.

providers:
  ollama-local:
    api: http://localhost:11434/v1
    api_key: ""
  # nous is intentionally NOT hand-defined here. Nous Portal is OAuth-based
  # (`hermes setup --portal`, or picking "Quick Setup" during install), and
  # that flow is expected to write its own provider registration -- unlike
  # ollama-local/openrouter's static api/api_key pairs, there's no fixed key
  # value to commit. Referenced below by the bare provider name `nous` on
  # the assumption that's what an OAuth-completed setup registers it as; if
  # your installed Hermes calls it something else, fix the name below.
  openrouter:
    api: https://openrouter.ai/api/v1
    # Uncertain: whether Hermes interpolates ${OPENROUTER_API_KEY} from the
    # environment here, or expects the literal key value. distribution.yaml
    # declares OPENROUTER_API_KEY as an env_requires entry either way, so
    # `hermes profile install` will prompt for it; if this field needs the
    # literal value instead of an env reference, that prompt is where it
    # should end up, not a hardcoded secret committed to this file.
    api_key: "${OPENROUTER_API_KEY}"

model:
  # Local by default, matching alfred-core's own "local inference by
  # default, cloud as an optional fallback" rule (ARCHITECTURE.md decision
  # 6) -- free, private, and good enough for most conversational turns.
  provider: ollama-local
  # qwen2.5:7b-instruct: confirmed available via `ollama list` during actual
  # setup, and Qwen2.5's instruct-tuned line has well-established Ollama
  # tool-calling support, which matters since Hermes needs reliable function
  # calls to actually use Alfred Core's MCP tools, not just chat. The
  # earlier placeholder here (llama3.2) wasn't pulled on the machine this
  # was first installed on and failed with an HTTP 404 the moment Hermes
  # tried to use it -- adjust this to whatever you've actually pulled
  # (`ollama list`) if it differs from this repo's own setup.
  default: "qwen2.5:7b-instruct"
  api_mode: chat_completions
  # Two fallback tiers, cheapest first: Nous Portal's free tier (OAuth,
  # zero cost, but capped at 50 RPM/500K TPM and limited to Hermes's
  # free-model catalog per https://hermes-agent.nousresearch.com/docs/integrations/nous-portal)
  # before ever falling through to OpenRouter, which is pay-as-you-go.
  # Drop "nous" from this list if you skip Nous Portal setup entirely.
  fallback_providers: ["nous", "openrouter"]
  fallback_model: "anthropic/claude-opus-4.7"
