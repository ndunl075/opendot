# Model/provider defaults for this profile. Per README.md's install flow,
# Hermes preserves this file across `hermes profile update` (pass
# --force-config to override), so local edits here are safe to make and keep.
#
# Verified against a real Hermes install (v0.20.0). Two things worth knowing
# about how that install actually behaves, differently from what upstream's
# own docs suggested going in:
#
# 1. This distribution's mcp.json is NOT automatically applied by
#    `hermes profile install` -- the real live mechanism is this file's own
#    `mcp_servers:` key, populated by running `hermes -p alfred mcp add
#    alfred --command alfred-mcp --args --client-id hermes` once after
#    install (see README.md step 4). That command answers an interactive
#    "Enable all 17 tools?" prompt it can't be scripted past, which is why
#    it isn't pre-populated here -- do it once, by hand, per install.
# 2. A locally-run model good enough to pass Hermes's own 64K-context
#    minimum was, in practice on real consumer hardware, too slow for
#    interactive use (multi-minute single turns) -- see fallback_providers
#    below for why Nous Portal ended up primary instead of Ollama.

providers:
  ollama-local:
    api: http://localhost:11434/v1
    api_key: ""
  # nous is intentionally NOT hand-defined here. Nous Portal is OAuth-based
  # (`hermes setup --portal`, or picking "Quick Setup" during install), and
  # that flow writes its own provider registration -- confirmed working as
  # the bare provider name `nous` with no api/api_key block of its own.
model:
  # Nous Portal primary, not Ollama: a local model large enough to clear
  # Hermes's 64K-context minimum (qwen3.5:9b, since qwen2.5:7b-instruct's
  # 32K fails that check outright) took several minutes per turn on ordinary
  # consumer hardware.
  #
  # step-3.7-flash over solar-pro4, measured on the same question through
  # the same profile: 25s against 119s. solar-pro4 is marketed as
  # agent-first and does call tools correctly, it is just far slower per
  # turn, and a two-minute reply to "what's on my agenda" is not a
  # conversation. Both are free on Nous Portal's $0/mo tier.
  provider: nous
  default: "stepfun/step-3.7-flash:free"
  api_mode: chat_completions
  # The only fallback is local. Keeping OpenRouter out of this chain makes
  # Alfred's operational cloud-spend ceiling exactly $0 while preserving a
  # private degraded mode when Nous is unavailable.
  fallback_providers: ["ollama-local"]
  fallback_model: "qwen3.5:9b"

# Supported, read-only public web search. DDGS needs no API key; install the
# optional package in Hermes's own environment as described in README.md.
web:
  search_backend: ddgs

# BrowserOS neo (https://www.browseros.com/neo/) gives Hermes real browser
# hands -- navigate, click, fill forms, read pages -- in a dedicated
# agent-driven browser signed into whatever sites you're logged into there.
# It runs locally and must already be open for this to connect. The port is
# NOT fixed: the docs say 9200, the installed build chose 9210, and the app
# records the live value in its own config.json under `ports.server`. Check
# there if this stops connecting after an update.
# See hermes-profile/README.md's BrowserOS section for the manual-setup
# alternative (`hermes -p alfred mcp add browseros-neo`) if this file's copy
# ever gets overwritten by a profile update.
mcp_servers:
  browseros-neo:
    url: "http://127.0.0.1:9210/mcp"

# Every Telegram turn runs through `hermes -z` (one-shot, no TTY), which
# unconditionally sets HERMES_YOLO_MODE=1 -- there's no one there to answer
# an approval prompt, so Hermes auto-approves everything in the normal
# "dangerous command" tier (rm -rf, chmod -R 777, git reset --hard, curl|sh,
# etc). This list is the one thing that still blocks those unconditionally,
# same floor as the code-shipped hardline list -- not even --yolo bypasses
# it. Deliberately broad substring matches (case-insensitive, matched
# anywhere in the command line) over precision: a false-positive just means
# running something yourself once instead of Alfred doing it. Loosen an
# individual pattern (e.g. narrow "*rm -rf*" to "*rm -rf ~*") if it blocks
# something you actually want automated often.
approvals:
  deny:
    # -- Filesystem destruction (non-root but still costly/irreversible) --
    - "*rm -rf*"
    - "*rm -fr*"
    - "*rm -r -f*"
    - "*rd /s*"
    - "*remove-item*-recurse*-force*"
    - "*remove-item*-force*-recurse*"
    - "*del /f /s /q*"
    - "*shred *"
    - "*wipefs*"
    - "*sdelete*"

    # -- Git: history/branch destruction, not everyday commits --
    - "*git reset --hard*"
    - "*git clean -fdx*"
    - "*git clean -xdf*"
    - "*git clean -fd*"
    - "*git push*--force*"
    - "*git push*-f *"
    - "*git filter-branch*"
    - "*git filter-repo*"
    - "*git update-ref -d*"
    - "*git branch -d*"
    - "*git branch -D*"

    # -- Permission/ownership blast radius --
    - "*chmod -r 777*"
    - "*chmod 777 /*"
    - "*chmod -r 000*"
    - "*chown -r*"
    - "*icacls*grant*everyone*"
    - "*takeown*"

    # -- Piping a remote script straight into a shell (supply-chain risk) --
    - "*curl*|*sh*"
    - "*curl*|*bash*"
    - "*wget*|*sh*"
    - "*wget*|*bash*"
    - "*iwr*|*iex*"
    - "*invoke-webrequest*|*invoke-expression*"
    - "*invoke-expression*downloadstring*"
    - "*curl*-o*/tmp/*&&*chmod*+x*"

    # -- Disk/partition tools --
    - "*mkfs*"
    - "*fdisk*"
    - "*diskpart*"
    - "*format *:*"
    - "*dd if=*of=/dev/*"
    - "*dd if=*of=\\\\.\\*"
    - "*clear-disk*"
    - "*format-volume*"
    - "*remove-partition*"

    # -- Ransomware-style anti-recovery moves --
    - "*vssadmin delete shadows*"
    - "*vssadmin resize shadowstorage*"
    - "*wbadmin delete*"
    - "*bcdedit*"
    - "*cipher /w*"

    # -- Registry, persistence, accounts (Windows) --
    - "*reg delete*"
    - "*reg add*\\run*"
    - "*net user*/delete*"
    - "*net localgroup administrators*/add*"
    - "*schtasks*/delete*/f*"
    - "*schtasks*/create*/ru system*"

    # -- Firewall / network surface --
    - "*netsh advfirewall*"
    - "*netsh firewall*"
    - "*iptables -f*"
    - "*iptables --flush*"
    - "*disable-netfirewallrule*"

    # -- Databases: irreversible without a backup --
    - "*drop database*"
    - "*drop table*"
    - "*drop schema*"
    - "*truncate table*"

    # -- Log/history erasure (anti-forensics feel) --
    - "*wevtutil cl*"
    - "*clear-eventlog*"
    - "*history -c*"
    - "*rm*.bash_history*"

    # -- Scheduled-task / cron wipe --
    - "*crontab -r*"

    # -- Process manager / service-level destruction --
    - "*sc delete*"
    - "*sc.exe delete*"
    - "*stop-service*-force*"
