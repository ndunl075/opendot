[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opendot-core"
version = "0.2.0"
description = "Local-first personal agent daemon"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenDot contributors" }]
dependencies = [
  "cryptography>=44,<51",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<27",
  "mcp>=1.10,<2",
  "pydantic>=2.8,<3",
  "sqlite-vec>=0.1.9,<1",
  "slack-sdk>=3.36,<4",
  "starlette>=0.40,<2",
  "tzdata>=2025.2,<2027",
  "uvicorn>=0.32,<1",
  "websockets>=13,<16",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.6"]

[project.scripts]
opendot = "opendot_core.cli:main"
opendot-mcp = "opendot_core.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/opendot_core"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/opendot_core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
