<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alfred{% endblock %} · Alfred</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <div class="brand-title">Alfred</div>
          <div class="brand-subtitle">local admin</div>
        </div>
      </div>
      <div class="nav">
        <a class="nav-item {% if active == 'overview' %}active{% endif %}" href="/">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 8.5 8 3l6 5.5M3.5 7.5V13a.5.5 0 0 0 .5.5h3v-4h2v4h3a.5.5 0 0 0 .5-.5V7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Overview
        </a>
        <a class="nav-item {% if active == 'approvals' %}active{% endif %}" href="/approvals">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 8.5 6.5 11 12 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/></svg>
          Approvals
        </a>
        <a class="nav-item {% if active == 'connectors' %}active{% endif %}" href="/connectors">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3" width="11" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="9" width="11" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/><circle cx="5" cy="5" r="0.75" fill="currentColor"/><circle cx="5" cy="11" r="0.75" fill="currentColor"/></svg>
          Connectors
        </a>
        <a class="nav-item {% if active == 'audit' %}active{% endif %}" href="/audit">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 2.5h6L12.5 5v8.5a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 8h4M6 10.3h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Audit log
        </a>
      </div>
      <div class="sidebar-footer">Read-only · loopback only</div>
    </nav>
    <main class="main">
      <div class="topbar">
        <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
        <div class="page-meta">{% block page_meta %}{% endblock %}</div>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
