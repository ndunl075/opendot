[package]
name = "opendot-desktop"
version = "0.1.0"
description = "OpenDot desktop shell: bundles the UI, starts or attaches to the daemon, tray with Pause and Open"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "opendot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
