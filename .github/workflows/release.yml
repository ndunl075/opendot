name: Release

# Triggered only by pushing a version tag (see RELEASING.md) -- never on an
# ordinary push or PR, so this never runs unattended against untrusted code.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # to create the GitHub Release and upload artifacts
  id-token: write # to mint the OIDC token attestation signing needs
  attestations: write # to publish the attestation to this repo

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Run the test suite against the built package
        run: |
          python -m pip install "dist/*.whl"
          python -m pip install ".[dev]"
          python -m pytest -q

      # Keyless, Sigstore-backed provenance for exactly these artifacts --
      # no GPG key or long-lived secret for Nico to generate or protect.
      # Verify a downloaded artifact with:
      #   gh attestation verify dist/<file> --repo ndunl075/alfred
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
