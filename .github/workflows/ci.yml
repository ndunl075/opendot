name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install alfred-core
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q
