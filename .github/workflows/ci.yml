name: CI

# Pull requests run on Linux only to keep Actions minutes low while the repo
# is private (macOS minutes cost 10x). Pushes to main and the nightly run use
# the full ubuntu/macos/windows matrix.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run --project daemon ruff check daemon

      - name: Test
        run: uv run --project daemon pytest daemon/tests -q

      - name: Doctor (CI-safe checks)
        run: uv run --project daemon opendot doctor --ci

  ui:
    # The UI is platform-independent web code, so one Linux job covers it. The desktop (Tauri) build
    # needs native WebKit packages and many Actions minutes; it is built locally for each milestone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm -C ui install --frozen-lockfile

      - name: Lint
        run: pnpm -C ui lint

      - name: Unit tests
        run: pnpm -C ui test

      - name: Build (fails if the generated contract types drifted)
        run: pnpm -C ui build

      - name: Install the Playwright browser
        run: pnpm -C ui exec playwright install --with-deps chromium

      - name: End-to-end tests (against the contract mock server)
        run: pnpm -C ui e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan history for secrets
        run: gitleaks git --no-banner
